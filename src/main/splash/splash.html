<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DynastyOS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #3a3a3a;
      }

      .bg {
        position: absolute;
        inset: 0;
        background-image: url('./splash-image.png');
        background-size: cover;
        background-position: center;
      }

      .overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0 28px 22px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .status {
        color: rgba(255, 255, 255, 0.85);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 8px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }

      .bar-track {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #60a5fa, #2563eb);
        transition: width 220ms ease;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="overlay">
      <div class="status" id="status">Starting...</div>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    </div>
    <script>
      if (window.splashApi) {
        window.splashApi.onProgress(function (payload) {
          var bar = document.getElementById('bar');
          var status = document.getElementById('status');
          if (bar) bar.style.width = payload.percent + '%';
          if (status) status.textContent = payload.status;
        });
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: cfbmedia:; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DynastyOS</title>
  </head>
  <!--
    The ground lives in globals.css (`body` / `.dark body`), NOT here. This
    element used to carry `dark:bg-slate-950`, which is #0a0a0b — and because a
    Tailwind utility outranks an `@layer base` rule, it silently beat the
    `.dark body { background-color: #000 }` declaration in the stylesheet.
    That one class was why the app kept reading dark-grey no matter how many
    surfaces were set to black: every fix was in the CSS, and the paint was
    coming from the HTML.
  -->
  <body>
    <div id="root"></div>
  </body>
</html>
